# Third-party attribution, generated by `cargo tribute`
# (https://crates.io/crates/cargo-tribute). `cargo tribute` refreshes LICENSES/,
# NOTICES/ and THIRD-PARTY.md from the Cargo dependency tree; `cargo tribute
# --check` exits 2 when what is committed no longer matches that tree.
#
# Everything here is a deliberate departure from the defaults, and nothing else
# is: the accepted list below is the default one plus the three additions noted
# in it, and the entries after it are the crates those defaults do not describe
# correctly.

# The allowlist, and the order an `A OR B` expression is read in: the first
# entry an expression can be satisfied by is the license attributed.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    # Three the default set does not carry, all of them permissive and all of
    # them reached through `sevenz-rust2`: `bzip2` compiles `libbz2-rs-sys`
    # under the bzip2 licence, and `ppmd-rust` offers CC0-1.0 or MIT-0, which
    # ask nothing of a redistributor at all.
    "bzip2-1.0.6",
    "CC0-1.0",
    "MIT-0",
    # RARLAB's UnRAR licence, which is outside the SPDX corpus and so is named
    # rather than spelled. Its text is licenses-extra/unrar.txt, and the
    # `[[extra]]` entry at the end of this file is the one that attributes it.
    "LicenseRef-UnRAR",
]

# MPL-2.0 is a file-level copyleft, and the one crate under it arrives through
# `directories` (with `dirs-sys` beneath it). Scoped to that crate so the
# exception stays visible instead of widening `accepted` for every dependency
# this project ever takes on.
[[exception]]
name = "option-ext"
allow = ["MPL-2.0"]

# `onig_sys` declares MIT, and its own LICENSE.md is explicit that the
# Oniguruma sources it vendors are "re-distributed under the original license:
# BSD-2-Clause". Both therefore apply to the C that `syntect` (through
# `two-face` and its `syntect-onig` feature) compiles into this binary.
[[clarify]]
name = "onig_sys"
version = "69.9.3"
expression = "MIT AND BSD-2-Clause"

# The UnRAR sources `unrar_sys` vendors under `vendor/unrar` are not a crate, so
# no dependency declaration covers them: that crate's MIT OR Apache-2.0 is the
# Rust wrapper alone, while the C++ it compiles in is RARLAB's. This is the
# licence README's note about RAR archives describes, given a place in the
# notices.
[[extra]]
name = "UnRAR (bundled in unrar_sys)"
expression = "LicenseRef-UnRAR"
url = "https://www.rarlab.com/license.htm"
copyright = "Copyright (C) Alexander L. Roshal"
notes = """
Compiled into the binary by `unrar_sys` from the UnRAR sources it vendors.
UnRAR source code may be used in any software to handle RAR archives without
limitations and free of charge, but may not be used to develop a RAR-compatible
archiver or to recreate the RAR compression algorithm, which is proprietary.
"""

[[license-text]]
id = "LicenseRef-UnRAR"
file = "licenses-extra/unrar.txt"
