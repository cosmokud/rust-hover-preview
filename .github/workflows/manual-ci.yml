name: Manual CI

# What CONTRIBUTING asks for before a push, run on demand rather than on every commit: the
# tree is formatted, lint-free and passing its tests, or the run is answered with a failure
# and the log that says what failed. It only checks — no formatting commit, no push, no
# release — and it is given no permission beyond reading the repository, so there is nothing
# else it could do.
#
# It runs when it is started by hand from the Actions tab, against whichever branch or commit
# is chosen there, and never on its own.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Formatting, lints and tests
    runs-on: windows-latest

    steps:
      # SECURITY: pinned to the commit the tag it is written against pointed at, the
      # way both deploy workflows pin theirs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The release `rust-toolchain.toml` names, asked for by name so the version a run
      # formats and lints with is the one in its log rather than whichever stable the
      # runner image happens to carry that week.
      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
