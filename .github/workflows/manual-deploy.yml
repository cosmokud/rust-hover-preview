name: Manual Deploy By Tag

on:
  workflow_dispatch:
    inputs:
      tag_to_build:
        description: "The exact tag to build and release"
        required: true
        type: string

jobs:
  windows-installers:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # SECURITY: Validate input to prevent someone from typing "main" or injecting shell commands
      - name: Validate tag format
        env:
          INPUT_TAG: ${{ inputs.tag_to_build }}
        shell: bash
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Error: Tag must start with 'v' followed by semantic versioning (e.g., v1.0.0)"
            exit 1
          fi

      # SECURITY: The input names a tag, so it has to be one. `ref:` below takes a branch
      # or a commit just as happily, and a branch named like a version would build code
      # that was never released.
      - name: Fail if the tag does not exist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_to_build }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o tag.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/ref/tags/${TAG}")
          if [[ "${status}" != "200" ]]; then
            echo "no tag named ${TAG} in ${REPO}: status ${status}"
            cat tag.json || true
            exit 1
          fi

      # IDEMPOTENCY: Check if release already exists.
      # Prevents you from accidentally overwriting a good release via a typo in the manual input.
      - name: Fail if release already exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_to_build }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${REPO}/releases/tags/${TAG}"
          status=$(curl -sS -o release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_url}")
          if [[ "${status}" == "200" ]]; then
            echo "release already exists for tag ${TAG}; refusing to overwrite"
            cat release.json
            exit 1
          fi
          if [[ "${status}" != "404" ]]; then
            echo "unexpected API status while checking tag ${TAG}: ${status}"
            cat release.json || true
            exit 1
          fi

      # SECURITY: Every action is pinned to the commit the tag it is written against
      # pointed at, not to the tag itself: a tag is its publisher's to move, and these run
      # with a token that can publish a release. The comment beside each pin names the
      # release it is, for the bump that moves it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag_to_build }}

      - name: Install Rust (MSVC)
        # Pinned to a commit in master's history, with the toolchain named in the input:
        # this action reads its ref as the toolchain otherwise, and a pin outside master
        # is one that gets garbage-collected.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)

      - name: Install cargo-packager
        shell: pwsh
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build Windows installers
        shell: pwsh
        run: .\build-installers.ps1

      # The version a running app reads; see the deploy workflow for what the address is for.
      # The installer is not copied out beside it: what a release carries is the one the
      # packager built, under the name it gave that file, and the app asks for it in the
      # release its own version names. A manual build is published with `make_latest: false`
      # below, so it does not become the release the running app is pointed at — the assets
      # are here for the release to be complete, not to offer an update from.
      - name: Prepare update assets
        shell: pwsh
        env:
          TAG: ${{ inputs.tag_to_build }}
        run: |
          $version = $env:TAG -replace '^v', ''
          Set-Content -Path target/packager/version.txt -NoNewline -Value $version

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-hover-preview-installers-${{ inputs.tag_to_build }}
          path: |
            target/packager/rust-hover-preview_*-setup.exe
            target/packager/version.txt
            target/github/rust-hover-preview.exe
          if-no-files-found: error

      - name: Extract Changelog
        shell: bash
        env:
          # SECURITY: the tag goes through the environment and is never written into the
          # script: an input may hold `$(…)`, which a shell would run.
          TAG: ${{ inputs.tag_to_build }}
        run: |
          VERSION="${TAG#v}"

          # Extract changelog section for the current version
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 {flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag_to_build }}
          name: ${{ inputs.tag_to_build }}
          body_path: release_notes.md
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: false
          files: |
            target/packager/rust-hover-preview_*-setup.exe
            target/packager/version.txt
            target/github/rust-hover-preview.exe
