name: Deploy

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  windows-installers:
    runs-on: windows-latest
    permissions:
      contents: write
    # SECURITY: Ensure this job strictly runs on tags
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      # IDEMPOTENCY: Only run this strict check on the very first attempt.
      # If you click "Re-run failed jobs", this skips so you can finish the release.
      - name: Fail if release already exists for tag
        if: github.run_attempt == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${REPO}/releases/tags/${TAG}"
          status=$(curl -sS -o release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_url}")
          if [[ "${status}" == "200" ]]; then
            echo "release already exists for tag ${TAG}; refusing to overwrite"
            cat release.json
            exit 1
          fi
          if [[ "${status}" != "404" ]]; then
            echo "unexpected API status while checking tag ${TAG}: ${status}"
            cat release.json || true
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        shell: pwsh
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build Windows installers
        shell: pwsh
        run: .\build-installers.ps1

      # The version a running app reads. `releases/latest/download/version.txt` is GitHub's
      # stable address for an asset of the newest release, so the check inside the app is a
      # fixed address instead of a query to the releases API: nothing to parse, and no rate
      # limit to spend.
      #
      # The installer is not copied out beside it. What a release carries is the one the
      # packager built, under the name it gave that file, and the app asks for it in the
      # release its own version names — one installer rather than two copies of the same
      # bytes, which is what a copy out under a second name left in the release.
      - name: Prepare update assets
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          Set-Content -Path target/packager/version.txt -NoNewline -Value $version

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-hover-preview-installers-${{ github.ref_name }}
          path: |
            target/packager/rust-hover-preview_*-setup.exe
            target/packager/version.txt
            target/github/rust-hover-preview.exe
          if-no-files-found: error

      - name: Extract Changelog
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          # Extract changelog section for the current version
          awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/packager/rust-hover-preview_*-setup.exe
            target/packager/version.txt
            target/github/rust-hover-preview.exe
