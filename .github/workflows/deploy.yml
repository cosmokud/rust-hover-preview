name: Deploy

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  windows-installers:
    runs-on: windows-latest
    permissions:
      contents: write
    # SECURITY: Ensure this job strictly runs on tags
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      # IDEMPOTENCY: Only run this strict check on the very first attempt.
      # If you click "Re-run failed jobs", this skips so you can finish the release.
      - name: Fail if release already exists for tag
        if: github.run_attempt == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${REPO}/releases/tags/${TAG}"
          status=$(curl -sS -o release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_url}")
          if [[ "${status}" == "200" ]]; then
            echo "release already exists for tag ${TAG}; refusing to overwrite"
            cat release.json
            exit 1
          fi
          if [[ "${status}" != "404" ]]; then
            echo "unexpected API status while checking tag ${TAG}: ${status}"
            cat release.json || true
            exit 1
          fi

      # SECURITY: Every action is pinned to the commit the tag it is written against
      # pointed at, not to the tag itself: a tag is its publisher's to move, and these run
      # with a token that can publish a release. The comment beside each pin names the
      # release it is, for the bump that moves it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The three things a release must not get wrong, checked before anything is built. A
      # release that fails any of them is one the app is never offered, or one with no notes,
      # and neither is visible from the release page afterwards.
      - name: The tag, the manifest and the changelog agree
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # What the app reads: three numbers, and a suffix after them for a pre-release.
          # Anything else is a version `parse_version` turns down, which reads as no update.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::${TAG} names '${VERSION}': a release is X.Y.Z, or X.Y.Z-rc.1"
            exit 1
          fi

          manifest=$(grep -m1 -E '^version = "' Cargo.toml | cut -d'"' -f2)
          if [[ "$manifest" != "$VERSION" ]]; then
            echo "::error::Cargo.toml in this tag says '${manifest}' and the tag says '${VERSION}': the installer is built under one version and asked for under the other, so this release would never be offered"
            exit 1
          fi

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section: the release would carry the generated notes instead of it"
            exit 1
          fi

          echo "the tag, Cargo.toml and the changelog agree on ${VERSION}"

          # A pre-release is published as one, which is what keeps `releases/latest` — the
          # address the app reads — pointed at the last stable release while it is out. The
          # app does not offer a version carrying a suffix, by design.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "${VERSION} is a pre-release: published as one, and not offered by the app"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust (MSVC)
        # Pinned to a commit in master's history, with the toolchain named in the input:
        # this action reads its ref as the toolchain otherwise, and a pin outside master
        # is one that gets garbage-collected.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)

      - name: Install cargo-packager
        shell: pwsh
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build Windows installers
        shell: pwsh
        run: .\build-installers.ps1

      # The version a running app reads. `releases/latest/download/version.txt` is GitHub's
      # stable address for an asset of the newest release, so the check inside the app is a
      # fixed address instead of a query to the releases API: nothing to parse, and no rate
      # limit to spend.
      #
      # The installer is not copied out beside it. What a release carries is the one the
      # packager built, under the name it gave that file, and the app asks for it in the
      # release its own version names — one installer rather than two copies of the same
      # bytes, which is what a copy out under a second name left in the release.
      - name: Prepare update assets
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          Set-Content -Path target/packager/version.txt -NoNewline -Value $version

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-hover-preview-installers-${{ github.ref_name }}
          path: |
            target/packager/rust-hover-preview_*-setup.exe
            target/packager/version.txt
            target/github/rust-hover-preview.exe
          if-no-files-found: error

      - name: Extract Changelog
        shell: bash
        env:
          # SECURITY: the tag goes through the environment and is never written into the
          # script: a ref name may hold `$(…)`, which a shell would run.
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"

          # Extract changelog section for the current version
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 {flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          # Set by the check above: a version carrying a suffix goes out as a pre-release, so
          # `releases/latest` — the address the app reads — stays where it is.
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/packager/rust-hover-preview_*-setup.exe
            target/packager/version.txt
            target/github/rust-hover-preview.exe
