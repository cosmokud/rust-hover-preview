[package]
name = "rust-hover-preview"
version = "0.3.1"
edition = "2021"
description = "Windows 11 system tray app that shows image, video, PDF, text, and archive previews on hover in Explorer"
authors = ["Rust Hover Preview Contributors"]
license = "MIT"
readme = "README.md"
rust-version = "1.98.1"
build = "build.rs"

[dependencies]
# Windows API bindings
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Accessibility",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_Media_MediaFoundation",
    # The update check, which is the one thing in this app that asks the network
    # anything: WinHTTP rather than an HTTP crate of its own, so the connection
    # is the machine's — its certificate store, and the proxy the user
    # configured — and nothing is bundled for either. See `updates`.
    "Win32_Networking_WinHttp",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Foundation",
    "Data_Pdf",
    "Storage_Streams",
    "Graphics_Imaging",
    "UI",
    "implement",
]}

# The `implement` feature above is what lets this app be handed an interface the system
# will call back into — the media engine's event sink is the one of those (see
# `video_player`) — and the macro it expands to names `windows_core` by its own path, so
# that crate has to be a dependency of this one rather than reached through `windows`.
# Nothing is added to the graph by saying so: `windows` already depends on exactly this
# version of it, and it is compiled either way.
windows-core = "0.58"

# Image handling. The decoders are named rather than defaulted, so what this app reads
# is the list itself: the defaults carry `avif`, which is ravif and with it rav1e — an
# AV1 *encoder*, in an app that only ever decodes one. It was never in the binary (the
# linker had no call site to pull it in from); what it was in is the build graph, and
# it is a crate the size of a small project to compile for every clean build. The
# formats this crate has no reader for at all are asked of Windows instead, which is
# what `Win32_Graphics_Imaging` above and `wic_image` are for.
#
# `webp` is one of those now: a still WebP is the picture the codec Windows has for it
# draws, at the box the layout planned, and the one that moves is libwebp's (see
# `webp-animation`), so `image-webp` — which was here for the stills alone — is out of
# the graph and out of the binary. The WebP codec is the one of those that is a Store
# package rather than something Windows ships, so the machine without it is answered by
# that same libwebp instead; see `webp_image`.
#
# `rayon` is out for the other reason: it is what this crate's parallel `ImageBuffer`
# iterators are behind, and nothing here iterates an image that way. What dropping it
# also drops is the EXR decoder's own threading (`exr/rayon`), which is the whole cost
# of it — a `.exr` preview decodes on one thread.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
] }

# SVG previews. Nothing here rasterizes a document: every one of them — still, gzipped
# or animated — is drawn by the browser engine that is already on the machine, in a
# window of its own (see `webview_preview`). What this side answers is the name gate and
# the size the document asks to be drawn at, which is what `roxmltree` is here for: the
# root element's own `width`, `height` and `viewBox`.
roxmltree = "0.21"

# The browser engine that is already on the machine, which draws every SVG document
# this app previews, still or moving: nothing is rasterized on this side, so a document
# is drawn at the size the preview is shown at by the one renderer on the machine that
# implements the whole of SVG rather than a subset of it. Pinned to the release that
# binds `windows` 0.58 — the version this app is on — because the two must agree on HWND
# and the COM types around it. The loader is linked in statically
# (`WebView2LoaderStatic.lib` is this crate's default), so the portable exe stays one
# file.
webview2-com = "0.34"

# WebP support via Google's libwebp: what plays the picture that moves, and — where
# Windows has no WebP codec to ask, which is what a Windows 10 machine usually is —
# what decodes the one that does not either; see `preview_window` and `webp_image`.
webp-animation = "0.10"

# The same libwebp, bound directly, for the still decode `webp_image` does — one C
# library in the graph rather than two, since this is the crate `webp-animation`
# reaches its own calls through.
libwebp-sys2 = "0.2"

# Animated GIF support. The version `image` reads its own GIFs with, so the decoder is
# one crate in the graph rather than two: everything this app asks of `gif` — the
# decode options, the color output, the frame records — is the same in both.
gif = "0.14"

# For async operations
once_cell = "1.19"

# For configuration storage
configparser = "1.0"
directories = "6.0"

# WOFF2 support for font previews: a webfont's tables are one Brotli stream, and this is
# what opens it to read the two tables a specimen is described by — the character map a
# sample line is checked against and the name the preview is titled with (see
# `font_preview`). Decompression only: the C++ woff2 library would be in the graph for
# compression, and for the glyf/loca reconstruction a font needs to be *drawn*, which is
# the browser's business here — this app rasterizes no font either.
brotli-decompressor = "5"

# Syntax highlighting for text and code previews (TextMate grammars and themes)
syntect = "5.3.0"

# Syntax definitions syntect does not bundle, curated by the bat project
two-face = { version = "0.4.3", default-features = false, features = ["syntect-onig"] }

# CommonMark parsing for the rendered Markdown preview mode
pulldown-cmark = { version = "0.10.0", default-features = false }

# What a file's own bytes say it is, asked before a file is handed to one of the engines
# this app drives: a `.docx` whose content is an MP4 is played by FFmpeg rather than
# offered to Word or LibreOffice, and a `.cdr` that is really a picture is previewed as
# one (see `content_type`). The common formats are this crate's — a small table of the
# signatures every tool agrees on — and the formats it does not carry but FFmpeg and
# LibreOffice do (a transport stream, an MXF, a raw H.264 stream, the PostScript a drawing
# is) are this app's own, in the shape the rest of it already asks signatures in.
#
# The default features are off, which is what keeps `cfb`, `uuid` and `fnv` out of the
# graph: they are there for reading an OLE compound file to tell a `.doc` from an `.xls`,
# and a box of that kind is not a kind this module answers with — what every `.doc`,
# `.xls` and `.ppt` is, is decided by its name, and by the container probe the Office tier
# already asks before it starts anything. Nothing else changes: measured against the same
# files, the answers are the same with the feature on and off.
infer = { version = "0.22", default-features = false, features = ["alloc"] }

# Archive listings and project containers. A listing decompresses nothing, which is
# what a listing needs, and the 7z codecs stay off for it; a project container is
# read for the one picture it holds of the whole document, so the zip crate is given
# deflate — and `deflate-flate2` rather than `deflate`, which is the feature that
# names both of the deflate implementations behind it, one a compressor this app
# never calls and the other a second deflate in the graph. What is left is `flate2`,
# already a dependency of this app for the tarball side of a listing, so nothing is
# added to the graph by reading a container. RAR has no settled pure-Rust reader —
# the one that exists pulls in GPL-3.0 code and needs a newer rustc — so the official
# UnRAR sources are compiled in by unrar_sys instead; see the UnRAR licence note in
# README.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
sevenz-rust2 = { version = "0.20", default-features = false }
unrar = "0.5"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
# The app only ever reads a 7z, so the encoder is a test-only feature of a crate
# it already depends on: the archive tests build their own fixtures.
sevenz-rust2 = { version = "0.20", features = ["compress", "util"] }

# The Brotli *compressor*, for the same reason: the woff2 parser tests build the stream
# they read back rather than checking a binary fixture into the tree.
brotli = "8"

# What this app is built out of is mostly other people's code — the Windows bindings,
# the syntax highlighter, the archive readers, the browser bindings — and what a change
# to it costs is mostly those crates and the link at the end. These two settings are what
# keeps that loop short: a dependency is compiled without debug information, which
# nothing steps through anyway, and the release link is thin LTO rather than
# whole-program, which is a few seconds of link instead of most of a minute.
[profile.dev]
# Line tables and nothing more, so a backtrace still names a file and a line.
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
# Optimization across codegen units rather than as one program: a couple of percent of
# run time at the very most, in exchange for most of the minute a fat-LTO link takes.
lto = "thin"
strip = true

# What the release artifacts are built with, and the only thing that uses it: the
# GitHub workflows and `build-installers.ps1` package with `--profile github`, while
# `cargo build --release` keeps the profile above, so the edit-build-test loop is still
# a short one. What ships is optimized as one program instead of as sixteen codegen
# units apiece — 419 KB, 5.7% of the release binary measured on 0.2.11 — and nothing
# about it is slower at run time.
[profile.github]
inherits = "release"
lto = "fat"
codegen-units = 1

[package.metadata.packager]
product-name = "Rust Hover Preview"
identifier = "dev.rust-hover-preview.app"
publisher = "Rust Hover Preview Contributors"
description = "Windows 11 system tray app that shows image, video, PDF, and text previews on hover in Explorer"
license-file = "LICENSE"
icons = ["assets/icon.ico"]
formats = ["nsis"]
out-dir = "target/packager"
# Where the `github` profile puts the binary it builds, which is the one an installer
# carries: see the profile's own note above for why the packaged app is not the one
# `cargo build --release` leaves in `target/release`.
binaries-dir = "target/github"
before-packaging-command = "cargo build --profile github"

[[package.metadata.packager.binaries]]
path = "rust-hover-preview"
main = true

[package.metadata.packager.nsis]
installMode = "currentUser"
template = "packaging/nsis/installer.nsi"
installer-icon = "assets/icon.ico"
appdata-paths = ["$APPDATA/rust-hover-preview"]
preinstall-section = """
Section PreInstall
  ; Where the app is copied to, which the sections after this one read.
  StrCpy $INSTDIR "$LOCALAPPDATA\\rust-hover-preview"

  ; Nothing is written into `config.ini` here. That file is the app's own: it is written on the
  ; first run, from the settings of the build that writes it, and every key in it is one that
  ; build reads. An installer that seeded it would be a second writer of the file, holding the
  ; defaults of whenever the installer was built, so an installation made that way would keep
  ; those values for good: a build that moves a default writes it where there is nothing to
  ; overwrite, and there would be something.
  ;
  ; The startup entry is not written here either, for the same reason: the app adds it on its
  ; first run, from the setting that asks for it and at the path it is running from.
  ;
  ; What is left is the one thing this section is for: an installation of an older version,
  ; which lived in a folder of its own.
  IfFileExists "$LOCALAPPDATA\\Rust Hover Preview\\rust-hover-preview.exe" 0 +2
    Delete "$LOCALAPPDATA\\Rust Hover Preview\\rust-hover-preview.exe"
  IfFileExists "$LOCALAPPDATA\\Rust Hover Preview\\uninstall.exe" 0 +2
    Delete "$LOCALAPPDATA\\Rust Hover Preview\\uninstall.exe"
  IfFileExists "$LOCALAPPDATA\\Rust Hover Preview\\uninstaller.exe" 0 +2
    Delete "$LOCALAPPDATA\\Rust Hover Preview\\uninstaller.exe"
  RMDir "$LOCALAPPDATA\\Rust Hover Preview"
SectionEnd
"""
