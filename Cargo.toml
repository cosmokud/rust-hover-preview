[package]
name = "rust-hover-preview"
version = "0.2.8"
edition = "2021"
description = "Windows 11 system tray app that shows image, video, PDF, text, and archive previews on hover in Explorer"
authors = ["Rust Hover Preview Contributors"]
license = "MIT"
readme = "README.md"
rust-version = "1.88"
build = "build.rs"

[dependencies]
# Windows API bindings
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Accessibility",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Foundation",
    "Data_Pdf",
    "Storage_Streams",
    "Graphics_Imaging",
    "UI",
    "implement",
]}

# Image handling
image = "0.25"

# SVG previews. A document is rasterized at the size the preview is shown at rather
# than decoded and resampled, by usvg + tiny-skia through resvg — pure Rust, and no
# external tool to install. `svgz` is off because a gzipped document is inflated on
# this side, and `memmap-fonts` is off because the font database is read into memory
# once.
resvg = { version = "0.48", default-features = false, features = [
    "raster-images",
    "system-fonts",
    "text",
] }

# The XML reader the animation pass works from: usvg drops `<animate>` elements, so
# what a document animates is read from its own text and written back into it per
# frame. Pinned to the version usvg parses with, so one reader is compiled in.
roxmltree = "0.21"

# The browser engine that is already on the machine, for a document that moves: usvg
# plays no animation, and where a document says more than this app's own reader can
# carry out, Chromium does. Pinned to the release that binds `windows` 0.58 — the
# version this app is on — because the two must agree on HWND and the COM types
# around it. The loader is linked in statically (`WebView2LoaderStatic.lib` is this
# crate's default), so the portable exe stays one file.
webview2-com = "0.34"

# Animated WebP support via Google's libwebp
webp-animation = "0.10"

# Animated GIF support
gif = "0.13"

# For async operations
once_cell = "1.19"

# For configuration storage
configparser = "1.0"
directories = "6.0"

# Syntax highlighting for text and code previews (TextMate grammars and themes)
syntect = "5.3.0"

# Syntax definitions syntect does not bundle, curated by the bat project
two-face = { version = "0.4.3", default-features = false, features = ["syntect-onig"] }

# CommonMark parsing for the rendered Markdown preview mode
pulldown-cmark = { version = "0.10.0", default-features = false }

# Archive listings: every reader below decompresses nothing, which is what a
# listing needs, so the zip crate's compression features and the 7z codecs are
# off. RAR has no settled pure-Rust reader — the one that exists pulls in
# GPL-3.0 code and needs a newer rustc — so the official UnRAR sources are
# compiled in by unrar_sys instead; see the UnRAR licence note in README.
zip = { version = "8", default-features = false }
sevenz-rust2 = { version = "0.20", default-features = false }
unrar = "0.5"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
# The app only ever reads a 7z, so the encoder is a test-only feature of a crate
# it already depends on: the archive tests build their own fixtures.
sevenz-rust2 = { version = "0.20", features = ["compress", "util"] }

# What this app is built out of is mostly other people's code — the Windows bindings,
# the syntax highlighter, the SVG renderer, the browser bindings — and what a change to
# it costs is mostly those crates and the link at the end. These two settings are what
# keeps that loop short: a dependency is compiled without debug information, which
# nothing steps through anyway, and the release link is thin LTO rather than
# whole-program, which is a few seconds of link instead of most of a minute.
[profile.dev]
# Line tables and nothing more, so a backtrace still names a file and a line.
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
# Optimization across codegen units rather than as one program: a couple of percent of
# run time at the very most, in exchange for most of the minute a fat-LTO link takes.
lto = "thin"
strip = true

[package.metadata.packager]
product-name = "Rust Hover Preview"
identifier = "dev.rust-hover-preview.app"
publisher = "Rust Hover Preview Contributors"
description = "Windows 11 system tray app that shows image, video, PDF, and text previews on hover in Explorer"
license-file = "LICENSE"
icons = ["assets/icon.ico"]
formats = ["nsis"]
out-dir = "target/packager"
binaries-dir = "target/release"
before-packaging-command = "cargo build --release"

[[package.metadata.packager.binaries]]
path = "rust-hover-preview"
main = true

[package.metadata.packager.nsis]
installMode = "currentUser"
template = "packaging/nsis/installer.nsi"
installer-icon = "assets/icon.ico"
appdata-paths = ["$APPDATA/rust-hover-preview"]
preinstall-section = """
Section PreInstall
  StrCpy $9 "0"
  IfFileExists "$APPDATA\\rust-hover-preview\\config.ini" +2 0
    StrCpy $9 "1"
  CreateDirectory "$APPDATA\\rust-hover-preview"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "run_at_startup"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "run_at_startup" "true"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "hover_delay_ms"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "hover_delay_ms" "0"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "preview_enabled"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "preview_enabled" "true"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "enable_off_trigger_key"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "enable_off_trigger_key" "true"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "off_trigger_key"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "off_trigger_key" "alt"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "confirm_file_type"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "confirm_file_type" "false"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "follow_cursor"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "follow_cursor" "false"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "same_file_rehover_delay_ms"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "same_file_rehover_delay_ms" "750"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "image_background"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "image_background" "black"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "svg_background"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "svg_background" "black"
  ReadINIStr $0 "$APPDATA\\rust-hover-preview\\config.ini" "settings" "video_volume"
  StrCmp $0 "" 0 +2
    WriteINIStr "$APPDATA\\rust-hover-preview\\config.ini" "settings" "video_volume" "0"
  StrCpy $INSTDIR "$LOCALAPPDATA\\rust-hover-preview"
  StrCmp $9 "1" 0 +2
    WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Run" "RustHoverPreview" "$INSTDIR\\rust-hover-preview.exe"
  IfFileExists "$LOCALAPPDATA\\Rust Hover Preview\\rust-hover-preview.exe" 0 +2
    Delete "$LOCALAPPDATA\\Rust Hover Preview\\rust-hover-preview.exe"
  IfFileExists "$LOCALAPPDATA\\Rust Hover Preview\\uninstall.exe" 0 +2
    Delete "$LOCALAPPDATA\\Rust Hover Preview\\uninstall.exe"
  IfFileExists "$LOCALAPPDATA\\Rust Hover Preview\\uninstaller.exe" 0 +2
    Delete "$LOCALAPPDATA\\Rust Hover Preview\\uninstaller.exe"
  RMDir "$LOCALAPPDATA\\Rust Hover Preview"
SectionEnd
"""
